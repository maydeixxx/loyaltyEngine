global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "loyalty-services"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "gateway-service:8080"
          - "transaction-service:8081"
          - "wallet-service:8082"
          - "rule-engine-service:8083"
          - "user-service:8084"
