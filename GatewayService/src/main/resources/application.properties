spring.application.name=GatewayService
server.port=8086

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#userService
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USERSERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/users/**

#walletService
spring.cloud.gateway.server.webmvc.routes[1].id=wallet-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://WALLET-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/wallets/**

#transactionService
spring.cloud.gateway.server.webmvc.routes[2].id=transaction-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://transaction-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/transactions/**

#ruleEngineService
spring.cloud.gateway.server.webmvc.routes[3].id=rule-engine-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://rule-engine-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/rules/**
