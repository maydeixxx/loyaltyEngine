spring.application.name=transaction-service
server.port=8081

spring.datasource.url=jdbc:postgresql://${INFRA_HOST}:5432/loyalty_db
spring.datasource.password=admin
spring.datasource.username=postgres
spring.jpa.hibernate.ddl-auto=validate

spring.kafka.bootstrap-servers=${INFRA_HOST}:9092
kafka.topics.dlqSuffix=.DLQ
kafka.topics.transaction-created=transaction_created
kafka.topics.points-failed=points_failed
kafka.topics.transaction-handled=transaction_handled

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://${INFRA_HOST}:9411/api/v2/spans

management.endpoints.web.exposure.include=health,prometheus

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true