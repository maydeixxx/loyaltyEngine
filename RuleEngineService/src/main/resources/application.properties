spring.application.name=rule-engine-service
server.port=8083

spring.datasource.url=jdbc:postgresql://${INFRA_HOST}:5433/ruleEngine_db
spring.datasource.password=admin
spring.datasource.username=postgres
spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=${INFRA_HOST}
spring.data.redis.port=6379

kafka.topics.transaction-created=transaction_created
kafka.topics.points-calculated=points_calculated
kafka.topics.dlq-suffix=.DLQ
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.kafka.bootstrap-servers=${INFRA_HOST}:9092

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://${INFRA_HOST}:9411/api/v2/spans

management.endpoints.web.exposure.include=health,prometheus

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true